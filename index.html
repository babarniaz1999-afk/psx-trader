<style>
:root{--bg:#0b1220;--cd:#131c2e;--ln:#23314d;--tx:#e8eefc;--mu:#8a9ab8;--g:#22c55e;--r:#ef4444;--b:#3b82f6}
*{box-sizing:border-box;margin:0;min-width:0}
body{font:15px/1.4 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:calc(10px + env(safe-area-inset-top)) 12px calc(80px + env(safe-area-inset-bottom));max-width:640px;margin:auto;overflow-x:hidden}
h2{font-size:22px;margin:6px 0 12px}h3{font-size:12px;color:var(--mu);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.box,.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.grid .card{margin:0}
.card span{display:block;color:var(--mu);font-size:12px}.card b{font-size:18px;word-break:break-word}
label{display:block;color:var(--mu);font-size:12px;margin:8px 0 3px}
input,select,button{font:inherit;font-size:16px;width:100%;min-height:44px;padding:9px 10px;border-radius:10px;border:1px solid var(--ln);background:#0e1626;color:var(--tx)}
button{background:var(--b);border:0;font-weight:600;font-size:14px;width:auto;color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}.full{width:100%;margin-bottom:10px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--ln);font-size:14px}.ln:last-child{border:0}.ln span{color:var(--mu)}.ln b{text-align:right;word-break:break-word}.big{font-size:18px}
.g{color:var(--g)}.r{color:var(--r)}.mu{color:var(--mu);font-size:12px;margin:6px 0}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;padding:9px 2px;font-size:13px;background:var(--cd);color:var(--mu)}.seg .on{background:var(--b);color:#fff}
.row3{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.row3 button{flex:1 1 28%;background:#1e2b46}.row3 .bad,.bad{background:#7f1d1d}
.hd{display:flex;justify-content:space-between;align-items:center}.sym{font-size:18px}.tag{font-size:11px;padding:2px 6px;border-radius:6px;background:#1e2b46;margin-left:6px}
.sub{margin-top:8px;border-top:1px dashed var(--ln);padding-top:6px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0e1626;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:14px 0;font-size:12px}nav .on{color:var(--b)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));padding:10px;border-radius:10px;background:#16a34a;text-align:center;display:none;font-size:14px}#toast.show{display:block}#toast.bad{background:#b91c1c}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);align-items:center;justify-content:center;padding:16px;z-index:9}#modal .box{width:100%;max-width:400px;margin:0}
:root{--bg:#070b14;--ln:#1b2a44;--b:#2dd4bf;--g:#34d399;--r:#fb7185}
body{background:radial-gradient(120% 55% at 50% -8%,#133a6b 0,#070b14 62%) fixed;font-feature-settings:'tnum'}
h2{font-size:26px;font-weight:800;letter-spacing:-.02em}h3{color:#7f93b5}
.box,.card{border-radius:18px;background:linear-gradient(180deg,#111b2e,#0d1524);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card b{font-size:19px;font-weight:700}
.hero{border-radius:22px;padding:18px;margin-bottom:12px;background:linear-gradient(135deg,#0f766e,#1d4ed8);box-shadow:0 14px 34px rgba(29,78,216,.35)}
.hero span{opacity:.8;font-size:13px;display:block}.hero b{display:block;font-size:32px;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px}.hero .s{display:flex;gap:28px}.hero i{font-style:normal;font-weight:700;font-size:17px}.hero .g{color:#bbf7d0}.hero .r{color:#fecaca}
input,select{background:#0a1220;border-radius:12px}input:focus,select:focus{outline:0;border-color:#2dd4bf;box-shadow:0 0 0 3px #2dd4bf33}
button{border-radius:12px;background:linear-gradient(135deg,#14b8a6,#2563eb)}
.seg{background:#0a1220;border-radius:14px;padding:4px}.seg button{background:none;border-radius:10px}.seg .on{background:linear-gradient(135deg,#14b8a6,#2563eb);color:#fff}
.row3 button{background:#1a2740}.row3 .bad,.bad{background:#7f1d1d}
.hd .g,.hd .r{padding:3px 10px;border-radius:20px;background:#ffffff12}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:8px 0}.stack i{display:block}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.ins{font-size:14px;padding:9px 11px;margin:6px 0;border-left:3px solid #f59e0b;background:#ffffff08;border-radius:8px}
nav{background:rgba(10,16,30,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;font-size:11px;padding:9px 0}nav .on{color:#2dd4bf;background:none}
nav button::before{content:'';width:23px;height:23px;background:currentColor;-webkit-mask-image:var(--i);mask-image:var(--i);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}

html{background:#070b14}
</style></head><body>
<div id="app"></div><div id="modal"></div><div id="toast"></div>
<nav><button data-p="dash" onclick="go('dash')">Dashboard</button><button data-p="calc" onclick="go('calc')">Calculator</button><button data-p="port" onclick="go('port')">Portfolio</button><button data-p="hist" onclick="go('hist')">History</button><button data-p="set" onclick="go('set')">Settings</button></nav>
<script>
const $=s=>document.querySelector(s),K='psx_trader_v1',D={br:.15,fx:0,ot:.035,tax:15,dt:15,cap:''};
const fresh=()=>({h:{},t:[],d:[],set:{...D},td:{}});
let S=load(),page='dash',tool='trade',sel=null,draft={},lots=[{q:'',p:''},{q:'',p:''}];
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.h&&d.t&&d.d)return{...fresh(),...d,set:{...D,...d.set}}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){msg('Could not save: browser storage unavailable',1)}}
const r2=x=>Math.round((x+Number.EPSILON)*100)/100,N=v=>{const x=parseFloat(v);return isFinite(x)?x:NaN};
const fm=x=>isFinite(x)?x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—',Rs=x=>'Rs. '+fm(x);
const cl=x=>x>0?'g':x<0?'r':'',pc=x=>isFinite(x)?(x>0?'+':'')+fm(x)+'%':'—',g=i=>$('#'+i).value,n=i=>N(g(i));
const L=(a,b,c='')=>`<div class=ln><span>${a}</span><b class="${c}">${b}</b></div>`,err=t=>`<p class=r>${t}</p>`;
const ymd=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const nowStr=()=>{const d=new Date();return ymd(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const fee=(gr)=>{const s=S.set,b=r2(gr*s.br/100+s.fx),c=r2(gr*s.ot/100),t=r2((b+c)*s.tax/100);return{b,c,t,tot:r2(b+c+t)}};
const fld=(id,l,v='',f='calc()')=>`<div><label>${l}</label><input id=${id} type=number inputmode=decimal step=any min=0 value="${v}" oninput="${f}"></div>`;
const feeBox=()=>`<div class=row>${fld('br','Brokerage %',S.set.br,'rf()')}${fld('fx','Fixed brokerage (Rs.)',S.set.fx,'rf()')}</div><div class=row>${fld('ot','Other charges %',S.set.ot,'rf()')}${fld('tx','Tax % on fees',S.set.tax,'rf()')}</div><p class=mu>Estimated rates. Defaults are placeholders; edit them to match your broker and current PSX/FBR schedules.</p>`;
const feeNote=()=>`<p class=mu>Fees: brokerage ${S.set.br}% + Rs. ${S.set.fx}, other ${S.set.ot}%, tax ${S.set.tax}% on fees (estimated; edit in Settings or the Trade tab).</p>`;
function msg(t,b){const e=$('#toast');e.textContent=t;e.className=b?'show bad':'show';clearTimeout(msg.h);msg.h=setTimeout(()=>e.className='',2800)}
function rf(){[['br','br'],['fx','fx'],['ot','ot'],['tx','tax']].forEach(([i,k])=>{S.set[k]=Math.max(0,n(i)||0)});save();calc()}
function go(p){page=p;render()}
function render(){const P={dash,calc:calcPage,port,hist,set:settings};$('#app').innerHTML=P[page]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p==page));draft={};calc();if(window.scrollTo)scrollTo(0,0)}
function stats(){let inv=0,mv=0;const ks=Object.keys(S.h);ks.forEach(k=>{inv+=S.h[k].c;mv+=S.h[k].q*S.h[k].p});
const rl=S.t.reduce((a,x)=>a+(x.rl||0),0),dv=S.d.reduce((a,x)=>a+x.net,0),bt=S.t.reduce((a,x)=>a+(x.side=='BUY'?x.net:0),0),un=mv-inv,y=ymd(),td=S.t.reduce((a,x)=>a+(x.dt.slice(0,10)==y?(x.rl||0):0),0)+(S.td[y]||0);
return{inv,mv,un,rl,dv,td,n:ks.length,ret:bt>0?(un+rl+dv)/bt*100:NaN}}
const card=(a,b,c='')=>`<div class=card><span>${a}</span><b class="${c}">${b}</b></div>`;
function dash0(){const s=stats();return `<h2>Dashboard</h2><div class=grid>${card('Invested capital',Rs(s.inv))}${card('Market value',Rs(s.mv))}${card('Unrealized P/L',Rs(s.un),cl(s.un))}${card('Realized P/L',Rs(s.rl),cl(s.rl))}${card("Today's P/L",Rs(s.td),cl(s.td))}${card('Dividends (net)',Rs(s.dv))}${card('Active holdings',s.n)}${card('Portfolio return',pc(s.ret),cl(s.ret))}</div>
<div class=box><label>Today's manual P/L entry (Rs.)</label><div class=row><input id=tdm type=number inputmode=decimal step=any value="${S.td[ymd()]??''}"><button onclick=setTd()>Save</button></div><p class=mu>Today's P/L = realized profit from today's sells + this manual entry.</p></div>
<p class=mu>Invested = cost of current holdings incl. buy charges. Unrealized P/L = market value − invested (before sell charges). Return % = (unrealized + realized + dividends) ÷ total bought. Market prices are entered manually in Portfolio; no live data.</p>`}
function dash(){const s=stats();return dash0().replace('<h2>Dashboard</h2>','<h2>Dashboard</h2>'+hero(s)).replace('<p class=mu>Invested =',ana(s)+'<p class=mu>Invested =')}
const hero=s=>{const t=s.un+s.rl+s.dv,a=x=>x>0?'▲ ':x<0?'▼ ':'';return `<div class=hero><span>Total portfolio value</span><b>${Rs(s.mv)}</b><div class=s><div><span>Total P/L</span><i class='${cl(t)}'>${a(t)}${Rs(t)}</i></div><div><span>Return</span><i class='${cl(s.ret)}'>${a(s.ret)}${pc(s.ret)}</i></div></div></div>`};
const wiH=v=>{const s=stats(),m=s.mv*(1+v/100);return L('New market value',Rs(m))+L('Change',Rs(m-s.mv),cl(m-s.mv))+L('Unrealized P/L then',Rs(m-s.inv),cl(m-s.inv))};
function wi(v){$('#wv').textContent=(v>0?'+':'')+v+'%';$('#wo').innerHTML=wiH(+v)}
function ana(s){const sl=S.t.filter(x=>x.rl!=null).sort((a,b)=>a.dt.localeCompare(b.dt)),w=sl.filter(x=>x.rl>0),l=sl.filter(x=>x.rl<0),sm=a=>a.reduce((p,x)=>p+x.rl,0),gw=sm(w),gl=-sm(l),rl=sl.map(x=>x.rl);
let c=0;const pts=sl.map(x=>c+=x.rl);let ch='<p class=mu>Equity curve appears after 2 or more closed (sell) trades.</p>';
if(pts.length>1){const mn=Math.min(0,...pts),R=Math.max(0,...pts)-mn||1,P=pts.map((v,i)=>(2+i/(pts.length-1)*296).toFixed(1)+','+(76-(v-mn)/R*72).toFixed(1)).join(' ');ch=`<svg viewBox='0 0 300 80' style='width:100%;height:80px'><polyline points='${P}' fill='none' stroke='${c>=0?'#34d399':'#fb7185'}' stroke-width='2.5' stroke-linejoin='round'/></svg>`}
const mv=s.mv,al=Object.keys(S.h).map(k=>{const h=S.h[k],v=h.q*h.p;return{k,v,u:(v/h.c-1)*100}}).sort((a,b)=>b.v-a.v),cs=['#2dd4bf','#3b82f6','#a78bfa','#f59e0b','#fb7185','#94a3b8'];
const bar=mv>0?`<div class=stack>${al.map((a,i)=>`<i style='width:${a.v/mv*100}%;background:${cs[i%6]}'></i>`).join('')}</div>`+al.map((a,i)=>L(`<i class=dot style='background:${cs[i%6]}'></i>${a.k}`,fm(a.v/mv*100)+'%')).join(''):'<p class=mu>Add holdings to see allocation.</p>';
const I=[],bw=[...al].sort((a,b)=>b.u-a.u),lo=al.filter(a=>a.u<-10).map(a=>a.k);
if(mv>0&&al[0].v/mv>.4)I.push(al[0].k+' is '+fm(al[0].v/mv*100)+'% of your portfolio: consider diversifying.');
if(lo.length)I.push('Down more than 10% vs cost: '+lo.join(', '));
if(bw.length>1)I.push('Best: '+bw[0].k+' ('+pc(bw[0].u)+'). Weakest: '+bw[bw.length-1].k+' ('+pc(bw[bw.length-1].u)+').');
if(gl>0&&gw<gl)I.push('Losses outweigh gains on closed trades (profit factor below 1).');
return `<div class=box><h3>Smart insights</h3>${I.length?I.map(t=>`<p class=ins>${t}</p>`).join(''):'<p class=mu>No alerts right now. Insights grow as you record trades.</p>'}</div><div class=box><h3>Performance analytics</h3>${ch}${L('Closed trades',sl.length)}${L('Win rate',sl.length?fm(w.length/sl.length*100)+'%':'—')}${L('Avg win / avg loss',sl.length?(w.length?fm(gw/w.length):'—')+' / '+(l.length?fm(-gl/l.length):'—'):'—')}${L('Profit factor',gl>0?fm(gw/gl):'—')}${L('Best / worst trade',sl.length?fm(Math.max(...rl))+' / '+fm(Math.min(...rl)):'—')}</div><div class=box><h3>Allocation</h3>${bar}</div><div class=box><h3>What-if simulator</h3><p class=mu>If every holding moves <b id=wv>0%</b></p><input type=range min=-30 max=30 value=0 oninput=wi(this.value) style='padding:0;min-height:30px'><div id=wo>${wiH(0)}</div></div>`}
function setTd(){const v=n('tdm');if(!isFinite(v))return msg('Enter a number',1);S.td[ymd()]=v;save();render();msg('Saved')}
function calcPage(){const T=[['trade','Trade'],['avg','Average'],['tgt','Targets'],['risk','Risk'],['div','Dividend']];return `<h2>Calculator</h2><div class=seg>${T.map(t=>`<button class="${tool==t[0]?'on':''}" onclick="tool='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`+({trade:tTrade,avg:tAvg,tgt:tTgt,risk:tRisk,div:tDiv})[tool]()}
function calc(){const o=$('#out');if(!o||page!='calc')return;({trade:cTrade,avg:cAvg,tgt:cTgt,risk:cRisk,div:cDiv})[tool](o)}
/* TRADE */
const tTrade=()=>`<div class=box><div class=row><div><label>Symbol</label>${dlist()}<input id=ty list=dl value="${draft.sym||''}" autocapitalize=characters placeholder="e.g. PSO" oninput="calc()"></div><div><label>Type</label><select id=ts onchange=calc()><option ${draft.side=='SELL'?'':'selected'}>BUY<option ${draft.side=='SELL'?'selected':''}>SELL</select></div></div><div class=row>${fld('tq','Quantity (shares)')}${fld('tp','Price per share')}</div>${feeBox()}<label>Date & time</label><input id=tdt type=datetime-local value="${nowStr()}"></div><div id=out class=box></div><button class=full onclick=saveTrade()>Save to ledger</button>`;
function tv(){const sym=g('ty').trim().toUpperCase(),side=g('ts'),q=n('tq'),p=n('tp'),h=S.h[sym];let e='';
if(!/^[A-Z0-9-]{1,12}$/.test(sym))e='Enter a valid symbol (letters/numbers only).';else if(!(q>0)||!Number.isInteger(q))e='Quantity must be a whole number above 0.';else if(!(p>0))e='Price must be above 0.';else if(side=='SELL'&&h&&q>h.q)e='Sell quantity exceeds your holding ('+h.q+').';
return{sym,side,q,p,e}}
function cTrade(o){const v=tv();if(v.e){o.innerHTML=err(v.e);return}
const gr=r2(v.q*v.p),f=fee(gr),buy=v.side=='BUY',net=r2(buy?gr+f.tot:gr-f.tot),h=S.h[v.sym];
let x=L('Gross value',Rs(gr))+L('Brokerage',Rs(f.b))+L('Other charges',Rs(f.c))+L('Tax (est.)',Rs(f.t))+L(buy?'Net payable':'Net receivable',Rs(net),'big');
if(h){x+=L('Current avg cost (incl. charges)',Rs(h.c/h.q));
if(buy)x+=L('New avg cost',Rs((h.c+net)/(h.q+v.q)))+L('New quantity',h.q+v.q);
else{const cr=h.c*v.q/h.q,pl=net-cr;x+=L('Cost of shares sold',Rs(cr))+L('Profit/Loss',Rs(pl),cl(pl))+L('Profit/Loss %',pc(pl/cr*100),cl(pl))+L('Remaining quantity',h.q-v.q)}}
else if(buy)x+=L('Avg cost per share (incl. charges)',Rs(net/v.q));else x+=err('No holding of '+v.sym+' recorded: P/L unavailable and sale cannot be saved.');
o.innerHTML=x}
function saveTrade(){const v=tv();if(v.e)return msg(v.e,1);if(v.side=='SELL'&&!S.h[v.sym])return msg('No holding to sell.',1);
const gr=r2(v.q*v.p),f=fee(gr),buy=v.side=='BUY',net=r2(buy?gr+f.tot:gr-f.tot);let h=S.h[v.sym],rl=null;
if(!h)h=S.h[v.sym]={q:0,g:0,c:0,p:v.p};
if(buy){h.q+=v.q;h.g+=gr;h.c+=net}else{const k=v.q/h.q,cr=h.c*k;rl=r2(net-cr);h.c-=cr;h.g-=h.g*k;h.q-=v.q;if(h.q<=0)delete S.h[v.sym]}
S.t.push({id:Date.now(),dt:g('tdt')||nowStr(),sym:v.sym,side:v.side,q:v.q,p:v.p,b:f.b,c:f.c,t:f.t,net,rl});save();$('#tq').value='';calc();msg('Saved '+v.side+' '+v.q+' '+v.sym)}
/* AVERAGE */
const lotsHtml=()=>lots.map((l,i)=>`<div class=row><div><label>#${i+1} Quantity</label><input type=number inputmode=decimal min=0 step=any value="${l.q}" oninput="lots[${i}].q=this.value;calc()"></div><div><label>Price</label><input type=number inputmode=decimal min=0 step=any value="${l.p}" oninput="lots[${i}].p=this.value;calc()"></div></div>`).join('');
const tAvg=()=>`<div class=box><label>Load existing holding (optional)</label><select onchange=ldLot(this.value)><option value="">—${Object.keys(S.h).map(k=>`<option>${k}`).join('')}</select><div id=lots>${lotsHtml()}</div><div class=row style="margin-top:8px"><button onclick="lots.push({q:'',p:''});$('#lots').innerHTML=lotsHtml()">+ Add purchase</button><button class=bad onclick="if(lots.length>1){lots.pop();$('#lots').innerHTML=lotsHtml();calc()}">Remove last</button></div><div class=row>${fld('aq','Buy more: quantity')}${fld('ap','At price')}</div>${feeNote()}</div><div id=out class=box></div>`;
function ldLot(k){const h=S.h[k];if(!h)return;lots[0]={q:h.q,p:+(h.g/h.q).toFixed(4)};$('#lots').innerHTML=lotsHtml();calc()}
function cAvg(o){const a=lots.map(l=>({q:N(l.q),p:N(l.p)})).filter(l=>l.q>0&&l.p>0);if(!a.length){o.innerHTML=err('Enter at least one purchase (quantity and price).');return}
const q=a.reduce((s,l)=>s+l.q,0),inv=r2(a.reduce((s,l)=>s+l.q*l.p,0)),ch=a.reduce((s,l)=>s+fee(r2(l.q*l.p)).tot,0);
let x=L('Total shares',q.toLocaleString())+L('Total investment',Rs(inv))+L('Weighted average price',Rs(inv/q),'big')+L('Est. buy charges',Rs(ch))+L('Average incl. charges',Rs((inv+ch)/q));
const aq=n('aq'),ap=n('ap');if(aq>0&&ap>0){const gr=r2(aq*ap),c2=fee(gr).tot;x+='<h3>After buying more</h3>'+L('Total shares',(q+aq).toLocaleString())+L('New weighted average',Rs((inv+gr)/(q+aq)),'big')+L('New average incl. charges',Rs((inv+ch+gr+c2)/(q+aq)))+L('Additional capital required',Rs(gr+c2))}
o.innerHTML=x}
/* TARGETS */
const tTgt=()=>`<div class=box><div class=row>${fld('xe','Entry (buy) price')}${fld('xq','Quantity')}</div>${fld('xs','Stop-loss %',5)}${feeNote()}</div><div id=out class=box></div>`;
function cTgt(o){const e=n('xe'),q=n('xq'),sl=n('xs');if(!(e>0&&q>0&&sl>0&&sl<100)){o.innerHTML=err('Enter entry price, quantity and a stop-loss % between 0 and 100.');return}
const s=S.set,gr=r2(q*e),cost=gr+fee(gr).tot,k=1+s.tax/100,r=(s.br+s.ot)/100*k,sp=m=>(cost*m+s.fx*k)/(q*(1-r));
let x=L('Total cost (incl. buy charges)',Rs(cost))+L('Break-even sell price',Rs(sp(1)),'big')+'<h3>Profit targets (after sell charges)</h3>';
x+=[2,5,10,15,20].map(P=>L(P+'% → '+Rs(sp(1+P/100)),'+'+Rs(cost*P/100)+' · RR '+fm(P/sl)+':1','g')).join('');
x+='<h3>Stop-loss −'+sl+'%</h3>'+L('Stop price',Rs(sp(1-sl/100)),'r')+L('Expected loss',Rs(-cost*sl/100),'r');o.innerHTML=x}
/* RISK */
const tRisk=()=>`<div class=box><div class=row>${fld('rc','Trading capital (Rs.)',S.set.cap)}${fld('rr','Max risk per trade %')}</div><div class=row>${fld('re','Entry price')}${fld('rs','Stop-loss price')}</div>${fld('rt','Target price (optional)')}<p class=mu>Uses percentage fees only (fixed brokerage ignored). Estimates.</p>${feeNote()}</div><div id=out class=box></div>`;
function cRisk(o){const c=n('rc'),rk=n('rr'),e=n('re'),st=n('rs'),t=n('rt');if(c>0){S.set.cap=c;save()}
if(!(c>0&&rk>0&&e>0&&st>0&&st<e)){o.innerHTML=err('Enter capital, risk %, entry price, and a stop-loss price below entry.');return}
const s=S.set,r=(s.br+s.ot)/100*(1+s.tax/100),lps=e*(1+r)-st*(1-r),ra=c*rk/100,sh=Math.min(Math.floor(ra/lps),Math.floor(c/(e*(1+r))));
if(sh<1){o.innerHTML=err('Risk budget or capital too small for 1 share.');return}
const inv=sh*e*(1+r);let x=L('Risk budget',Rs(ra))+L('Max shares to buy',sh.toLocaleString(),'big')+L('Total investment (est.)',Rs(inv))+L('Max potential loss',Rs(-sh*lps),'r')+L('Position size',fm(inv/c*100)+'% of capital');
if(t>e)x+=L('Profit at target',Rs(sh*(t*(1-r)-e*(1+r))),'g')+L('Risk-to-reward','1 : '+fm((t*(1-r)-e*(1+r))/lps));o.innerHTML=x}
/* DIVIDEND */
const tDiv=()=>`<div class=box><label>Stock symbol</label><input id=dy autocapitalize=characters onchange=ldDiv()><div class=row>${fld('dq','Number of shares')}${fld('dd','Dividend per share')}</div><div class=row>${fld('dt2','Tax %',S.set.dt)}${fld('da','Avg purchase price')}</div></div><div id=out class=box></div><button class=full onclick=saveDiv()>Save dividend income</button>`;
function ldDiv(){const h=S.h[g('dy').trim().toUpperCase()];if(h){$('#dq').value=h.q;$('#da').value=r2(h.g/h.q)}calc()}
function cDiv(o){const q=n('dq'),d=n('dd'),t=n('dt2'),a=n('da');if(!(q>0&&d>0&&t>=0&&t<=100)){o.innerHTML=err('Enter shares, dividend per share and tax % (0–100).');return}
const gr=r2(q*d),tx=r2(gr*t/100),nt=r2(gr-tx);let x=L('Gross dividend',Rs(gr))+L('Withholding tax (est.)',Rs(-tx),'r')+L('Net dividend income',Rs(nt),'big');
if(a>0)x+=L('Gross yield on avg price',fm(d/a*100)+'%')+L('Net yield on avg price',fm(nt/q/a*100)+'%');o.innerHTML=x}
function saveDiv(){const sy=g('dy').trim().toUpperCase(),q=n('dq'),d=n('dd'),t=n('dt2');if(!/^[A-Z0-9-]{1,12}$/.test(sy)||!(q>0)||!(d>0)||!(t>=0&&t<=100))return msg('Enter symbol, shares, dividend and tax %.',1);
const gr=r2(q*d),tx=r2(gr*t/100);S.d.push({id:Date.now(),dt:nowStr(),sym:sy,q,dps:d,tax:tx,net:r2(gr-tx)});S.set.dt=t;save();msg('Dividend saved')}
/* PORTFOLIO */
function port0(){const ks=Object.keys(S.h).sort(),mv=ks.reduce((a,k)=>a+S.h[k].q*S.h[k].p,0);
return `<h2>Portfolio</h2><button class=full onclick="goTrade('','BUY')">+ Add stock / record buy</button>`+(ks.length?ks.map(k=>{const h=S.h[k],v=h.q*h.p,u=v-h.c;return `<div class=box><div class=hd><b class=sym>${k}${tags(k)}</b><b class="${cl(u)}">${pc(u/h.c*100)}</b></div>${L('Quantity',h.q.toLocaleString())}${L('Avg price (excl. / incl. charges)',fm(h.g/h.q)+' / '+fm(h.c/h.q))}<label>Current market price (manual)</label><input type=number inputmode=decimal step=any min=0 value="${h.p}" onchange="setP('${k}',this.value)">${L('Invested',Rs(h.c))}${L('Market value',Rs(v))}${L('Unrealized P/L',Rs(u),cl(u))}${L('Allocation',mv>0?fm(v/mv*100)+'%':'—')}<div class=row3><button onclick="goTrade('${k}','BUY')">Buy more</button><button onclick="goTrade('${k}','SELL')">Sell</button><button onclick="ed('${k}')">Edit</button><button onclick="sel=sel=='${k}'?null:'${k}';render()">Stats</button><button class=bad onclick="rm('${k}')">Remove</button></div>${sel==k?detail(k):''}</div>`}).join(''):'<p class=mu>No holdings yet. Record a buy to add one.</p>')}
function detail(k){const h=S.h[k],t=S.t.filter(x=>x.sym==k),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0),bq=sum(t.filter(x=>x.side=='BUY'),x=>x.q),sq=sum(t.filter(x=>x.side=='SELL'),x=>x.q),rl=sum(t,x=>x.rl||0),dv=sum(S.d.filter(x=>x.sym==k),x=>x.net),u=h.q*h.p-h.c;
return `<div class=sub>${L('Shares bought / sold',bq+' / '+sq)}${L('Realized P/L',Rs(rl),cl(rl))}${L('Unrealized P/L',Rs(u),cl(u))}${L('Dividends (net)',Rs(dv))}${L('Total return',Rs(rl+u+dv),cl(rl+u+dv))}</div>`}
const STK0='OGDC|Oil and Gas Development Co.|KM;UBL|United Bank|K;MEBL|Meezan Bank|KM;FFC|Fauji Fertilizer Co.|KM;MARI|Mari Energies|KM;PPL|Pakistan Petroleum|KM;LUCK|Lucky Cement|KM;MCB|MCB Bank|K;HBL|Habib Bank|K;PAKT|Pakistan Tobacco Co.|K;NBP|National Bank of Pakistan|K;NESTLE|Nestle Pakistan|K;ENGROH|Engro Holdings|KM;FATIMA|Fatima Fertilizer|K;COLG|Colgate-Palmolive Pakistan|K;BWCL|Bestway Cement|K;HUBC|Hub Power Co.|KM;EFERT|Engro Fertilizers|KM;SYS|Systems Ltd|KM;POL|Pakistan Oilfields|K;PSO|Pakistan State Oil|KM;BAFL|Bank Alfalah|K;ATRL|Attock Refinery|KM;MTL|Millat Tractors|KM;AIRLINK|Air Link Communication|M;CNERGY|Cnergyico PK|M;CPHL|Citi Pharma|M;DGKC|D.G. Khan Cement|M;FCCL|Fauji Cement|M;FFL|Fauji Foods|M;GAL|Ghandhara Automobiles|M;GHNI|Ghandhara Industries|M;GLAXO|GlaxoSmithKline Pakistan|M;MLCF|Maple Leaf Cement|M;NRL|National Refinery|M;PAEL|Pak Elektron|M;PRL|Pakistan Refinery|M;SAZEW|Sazgar Engineering Works|M;SEARL|The Searle Company|M;SNGP|Sui Northern Gas Pipelines|M;SSGC|Sui Southern Gas Co.|M;ABL|Allied Bank;AKBL|Askari Bank;BAHL|Bank AL Habib;BOP|Bank of Punjab;FABL|Faysal Bank;HMB|Habib Metropolitan Bank;SNBL|Soneri Bank;BIPL|BankIslami Pakistan;JSBL|JS Bank;AICL|Adamjee Insurance;EPCL|Engro Polymer and Chemicals;LOTCHEM|Lotte Chemical Pakistan;FFBL|Fauji Fertilizer Bin Qasim;KAPCO|Kot Addu Power;NPL|Nishat Power;NCPL|Nishat Chunian Power;KEL|K-Electric;CHCC|Cherat Cement;KOHC|Kohat Cement;PIOC|Pioneer Cement;ACPL|Attock Cement;POWER|Power Cement;GWLC|Gharibwal Cement;INDU|Indus Motor;PSMC|Pak Suzuki Motor;HCAR|Honda Atlas Cars;APL|Attock Petroleum;SHEL|Shell Pakistan;TRG|TRG Pakistan;AVN|Avanceon;NETSOL|NetSol Technologies;OCTOPUS|Octopus Digital;PTC|Pakistan Telecommunication;UNITY|Unity Foods;TREET|Treet Corp;ILP|Interloop;NML|Nishat Mills;GATM|Gul Ahmed Textile;ABOT|Abbott Laboratories Pakistan;AGP|AGP Ltd;HINOON|Highnoon Laboratories;FEROZ|Ferozsons Laboratories;IBFL|Ibrahim Fibres;MUREB|Murree Brewery;PKGS|Packages Ltd;THALL|Thal Ltd;TGL|Tariq Glass;ISL|International Steels;PIBTL|Pakistan Intl Bulk Terminal;PAKRI|Pakistan Reinsurance;DAWH|Dawood Hercules;FCEPL|FrieslandCampina Engro;PSX|Pakistan Stock Exchange';
let pv='h',sf='all';
function allStk(){const o={};STK0.split(';').forEach(r=>{const[a,b,c='']=r.split('|');o[a]={n:b,k:c.includes('K'),m:c.includes('M')}});return{...o,...(S.stk||{})}}
const tags=k=>{const s=allStk()[k]||{};return (s.k?'<span class=tag>KSE-100</span>':'')+(s.m?'<span class=tag>KMI-30</span>':'')};
const dlist=()=>`<datalist id=dl>${Object.entries(allStk()).map(([k,v])=>`<option value=${k}>${v.n}`).join('')}</datalist>`;
function port(){return `<div class=seg><button class='${pv=='h'?'on':''}' onclick=\"pv='h';render()\">Holdings</button><button class='${pv=='s'?'on':''}' onclick=\"pv='s';render()\">PSX Stocks</button></div>`+(pv=='h'?port0():stk())}
function slq0(q){q=q.toUpperCase();const r=Object.entries(allStk()).filter(([k,v])=>(sf=='all'||(sf=='k'&&v.k)||(sf=='m'&&v.m)||(sf=='h'&&S.h[k]))&&(k.includes(q)||v.n.toUpperCase().includes(q))).sort();return r.length?`<p class=mu>${r.length} stocks</p>`+r.map(([k,v])=>`<div class=box><div class=hd><span><b class=sym>${k}</b>${tags(k)}</span><button onclick=\"goTrade('${k}','BUY')\">Trade</button></div><p class=mu>${v.n}</p></div>`).join(''):'<p class=mu>No match. You can still type any PSX symbol in the Trade tab.</p>'}
const slq=()=>{$('#sl').innerHTML=slq0($('#sq').value)};
function stk(){return `<p class=mu>Directory of commonly traded PSX symbols. KSE-100 tag shows only for names confirmed from public sources; KMI-30 follows the last list I could retrieve. Index lists are rebalanced twice a year, so verify on psx.com.pk and use Manage list below to correct it.</p><input id=sq placeholder='Search symbol or company' oninput=slq() style='margin-bottom:8px'><div class=seg>${[['all','All'],['k','KSE-100'],['m','KMI-30'],['h','Held']].map(a=>`<button class='${sf==a[0]?'on':''}' onclick=\"sf='${a[0]}';render()\">${a[1]}</button>`).join('')}</div><div id=sl>${slq0('')}</div><div class=box><h3>Manage list</h3><p class=mu>One stock per line: SYMBOL,Company name,KSE100,KMI30 (use 1 or 0). Adds new stocks or replaces existing entries and their tags.</p><textarea id=st rows=4 placeholder='ABC,Company name,1,0' style='width:100%;padding:10px;border-radius:12px;border:1px solid var(--ln);background:#0a1220;color:var(--tx);font-size:16px;margin-bottom:8px'></textarea><button class=full onclick=saveStk()>Save to list</button></div>`}
function saveStk(){S.stk=S.stk||{};let c=0;$('#st').value.split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>{const[a,b,k,m]=x.split(',').map(y=>y.trim()),s=(a||'').toUpperCase();if(/^[A-Z0-9-]{1,12}$/.test(s)){S.stk[s]={n:b||(allStk()[s]||{}).n||s,k:k=='1',m:m=='1'};c++}});save();render();msg(c+' stocks saved')}
function goTrade(sym,side){draft={sym,side};page='calc';tool='trade';render()}
function setP(k,v){const p=N(v);if(!(p>0)){msg('Enter a valid price',1);return render()}S.h[k].p=p;save();render()}
function ed(k){const h=S.h[k];ask('Edit '+k,[['Quantity',h.q],['Average cost per share (incl. charges)',r2(h.c/h.q)]],v=>{const q=N(v[0]),a=N(v[1]);if(!(q>0&&Number.isInteger(q)&&a>0))return msg('Invalid values',1);h.q=q;h.c=q*a;h.g=q*a;save();render();msg('Holding updated (ledger unchanged)')})}
function rm(k){ask('Remove '+k+' from the portfolio? Ledger history is kept.',[],()=>{delete S.h[k];save();render()})}
/* HISTORY */
function hist(){const t=[...S.t].sort((a,b)=>b.dt.localeCompare(a.dt)),d=[...S.d].sort((a,b)=>b.dt.localeCompare(a.dt));
return `<h2>Trading History</h2>`+(t.length?t.map(x=>`<div class=box><div class=hd><b>${x.sym}<span class=tag>${x.side}</span></b><span class=mu>${x.dt.replace('T',' ')}</span></div>${L('Quantity × price',x.q.toLocaleString()+' × '+fm(x.p))}${L('Brokerage / charges / tax',fm(x.b)+' / '+fm(x.c)+' / '+fm(x.t))}${L('Net amount',Rs(x.net))}${x.rl!=null?L('Realized P/L',Rs(x.rl),cl(x.rl)):''}</div>`).join(''):'<p class=mu>No transactions yet.</p>')+`<h2>Dividends</h2>`+(d.length?d.map(x=>`<div class=box><div class=hd><b>${x.sym}</b><span class=mu>${x.dt.replace('T',' ')}</span></div>${L('Shares × DPS',x.q.toLocaleString()+' × '+fm(x.dps))}${L('Tax withheld',Rs(x.tax))}${L('Net dividend',Rs(x.net),'g')}</div>`).join(''):'<p class=mu>No dividends recorded.</p>')}
/* SETTINGS & DATA */
const inst=()=>navigator.standalone?'':`<div class=box><h3>Install on iPhone</h3><p class=mu>Open this page in Safari, tap Share, then Add to Home Screen. It then opens full-screen like an app and keeps working offline once loaded from your own web address.</p></div>`;
const settings=()=>`<h2>Settings</h2>${inst()}<div class=box><h3>Fees & tax (estimated)</h3>${feeBox()}</div><div class=box><h3>Data</h3><div class=row3><button onclick=expT()>Export transactions CSV</button><button onclick=expP()>Export portfolio CSV</button><button onclick=bak()>Backup JSON</button></div><label>Restore from JSON backup</label><input type=file accept=".json,application/json" onchange=rst(this)><button class="bad full" style="margin-top:12px" onclick=clr()>Clear all data</button></div><div class=box><h3>Cost-basis method</h3><p class=mu>Weighted-average cost. Each buy adds shares × price plus estimated charges to the position's cost; average cost = total cost ÷ shares. A sell removes cost in proportion to shares sold (average stays the same) and realized P/L = net proceeds after sell charges − removed cost. Charges are counted once, on the trade they belong to. Ledger entries are never deleted by new transactions. Figures are estimates; prices are entered manually.</p></div>`;
const csv=r=>r.map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
async function dl(name,text,type){try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:name,data:text});return}}}catch(e){if(e&&e.code=='declined')return}
const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function ask(t,fs,ok){const m=$('#modal');m.innerHTML=`<div class=box><h3>${t}</h3>${fs.map((f,i)=>`<label>${f[0]}</label><input id=m${i} value="${f[1]}" inputmode=decimal>`).join('')}<div class=row style="margin-top:10px"><button class=bad onclick="$('#modal').style.display='none'">Cancel</button><button onclick="mok()">OK</button></div></div>`;m.style.display='flex';window.mok=()=>{const v=fs.map((_,i)=>$('#m'+i).value);m.style.display='none';ok(v)}}
function expT(){dl('psx-transactions.csv',csv([['Date/Time','Symbol','Type','Qty','Price','Brokerage','Charges','Tax','Net amount','Realized P/L'],...S.t.map(x=>[x.dt,x.sym,x.side,x.q,x.p,x.b,x.c,x.t,x.net,x.rl??''])]),'text/csv')}
function expP(){const ks=Object.keys(S.h),mv=ks.reduce((a,k)=>a+S.h[k].q*S.h[k].p,0);dl('psx-portfolio.csv',csv([['Symbol','Qty','Avg excl charges','Avg incl charges','Market price','Invested','Market value','Unrealized P/L','Allocation %'],...ks.map(k=>{const h=S.h[k],v=h.q*h.p;return[k,h.q,r2(h.g/h.q),r2(h.c/h.q),h.p,r2(h.c),r2(v),r2(v-h.c),mv>0?r2(v/mv*100):0]})]),'text/csv')}
function bak(){dl('psx-backup-'+ymd()+'.json',JSON.stringify(S,null,1),'application/json')}
function rst(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d.h!='object'||!Array.isArray(d.t)||!Array.isArray(d.d))throw 0;ask('Replace all current data with this backup?',[],()=>{S={...fresh(),...d,set:{...D,...d.set},td:d.td||{}};save();render();msg('Backup restored')})}catch(e){msg('Invalid backup file',1)}inp.value=''};r.readAsText(f)}
function clr(){ask('Delete ALL data? Type DELETE to confirm.',[['Confirmation','']],v=>{if(v[0]=='DELETE'){S=fresh();save();render();msg('All data cleared')}})}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
